<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>newos</title>
<style>
  :root {
    --bg: #f6f3ec; --paper: #fffdf8; --ink: #23201b; --muted: #7b7468; --line: #e6dfd1;
    --accent: #2f5d50; --accent-ink: #fff; --bot: #eef3ef; --me: #2f5d50; --warn: #a2482b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height: 100%; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    border-bottom: 1px solid var(--line); background: var(--paper); }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.3px; }
  .brand span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 13px; }
  .grow { flex: 1; }
  select, .btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff;
    border-radius: 10px; padding: 6px 10px; color: var(--ink); cursor: pointer; }
  .btn:hover, select:hover { border-color: #cfc5b2; }
  .btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .log { flex: 1; overflow-y: auto; padding: 22px 6% 12px; }
  .msg { max-width: 720px; margin: 0 0 12px; display: flex; }
  .msg.me { justify-content: flex-end; margin-left: auto; }
  .bubble { padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word;
    max-width: 100%; }
  .bot .bubble { background: var(--bot); border-top-left-radius: 4px; }
  .me .bubble { background: var(--me); color: #fff; border-top-right-radius: 4px; }
  .bot .speak { border: 0; background: none; cursor: pointer; opacity: .45; font-size: 15px; margin-left: 4px; align-self: flex-end; }
  .bot .speak:hover { opacity: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 6% 10px; }
  .chip { font-size: 13px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; color: var(--ink); }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  form.bar { display: flex; gap: 8px; padding: 12px 6% 18px; border-top: 1px solid var(--line); background: var(--paper); }
  form.bar input { flex: 1; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; }
  form.bar input:focus { outline: 2px solid #bcd3c9; border-color: var(--accent); }
  .round { width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: #fff;
    font-size: 20px; cursor: pointer; }
  .round.send { background: var(--accent); color: #fff; border-color: var(--accent); }
  .round.live { background: #c0392b; color: #fff; border-color: #c0392b; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(192,57,43,.18); } }
  .interim { color: var(--muted); font-style: italic; padding: 0 6% 6px; min-height: 1.5em; font-size: 14px; }
  aside { border-left: 1px solid var(--line); background: var(--paper); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 2px; padding: 10px 10px 0; flex-wrap: wrap; }
  .tab { font-size: 13px; padding: 6px 10px; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--muted); border: 0; background: none; }
  .tab.active { background: var(--bg); color: var(--ink); font-weight: 600; }
  .panel { flex: 1; overflow-y: auto; padding: 12px 14px; background: var(--bg); font-size: 14px; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 14px 0 6px; }
  .panel h3:first-child { margin-top: 0; }
  .panel ul { margin: 0; padding-left: 18px; }
  .panel li { margin: 3px 0; }
  .panel .empty { color: var(--muted); }
  .panel .w { font-weight: 600; }
  .panel .src { font-size: 11px; color: var(--muted); margin-left: 4px; }
  .foot { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .note { font-size: 12px; color: var(--muted); padding: 0 12px 10px; }
  .offline { background: #fff3e6; color: var(--warn); padding: 10px 6%; font-size: 14px; display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside { display: none; }
    aside.open { display: flex; position: fixed; inset: 56px 0 0 0; z-index: 4; }
    .tag { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">new<span>os</span></div>
    <div class="tag">a chatbot that learns words, logic and what you teach it</div>
    <div class="grow"></div>
    <label class="tag" for="sem">“if” means</label>
    <select id="sem" title="Semantics of if…then">
      <option value="material">material conditional</option>
      <option value="strict">strict (modal)</option>
      <option value="relevance">relevance logic</option>
      <option value="lewis">Lewis (closest worlds)</option>
      <option value="stalnaker">Stalnaker (closest world)</option>
      <option value="adams">Adams (probability)</option>
    </select>
    <button class="btn" id="voiceBtn" title="Read replies aloud">🔈 Voice</button>
    <button class="btn" id="panelBtn" title="What I know">🧠</button>
  </header>

  <section class="chat">
    <div class="offline" id="offline">Can't reach the newos server. Start it with <b>swipl newos.pl</b> and reload.</div>
    <div class="log" id="log"></div>
    <div class="chips" id="chips"></div>
    <div class="interim" id="interim"></div>
    <form class="bar" id="bar">
      <input id="text" autocomplete="off" placeholder="Say something… e.g. Socrates is a man." autofocus>
      <button type="button" class="round" id="micBtn" title="Talk (voice input)">🎙</button>
      <button type="submit" class="round send" title="Send">➤</button>
    </form>
  </section>

  <aside id="side">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="logic">Logic</button>
      <button class="tab" data-tab="worlds">Worlds</button>
      <button class="tab" data-tab="words">Dictionary</button>
      <button class="tab" data-tab="replies">Replies</button>
      <button class="tab" data-tab="files">Files</button>
    </div>
    <div class="panel" id="panel"></div>
    <div class="foot">
      <button class="btn" id="saveBtn">💾 Save</button>
      <a class="btn" href="api/export" id="exportBtn" style="text-decoration:none">⬇ Export</a>
      <label class="btn">⬆ Import<input type="file" id="importIn" accept=".pl,.txt" hidden></label>
      <button class="btn" id="resetBtn">Reset…</button>
    </div>
    <div class="note">Everything is saved to <code>data/knowledge.pl</code> after each message.</div>
  </aside>
</div>

<script src="static/tts.js"></script>
<script>if (!window.NewosVoice) document.write('<script src="tts.js"><\/script>');</script>
<script>
"use strict";
// If static/tts.js didn't load, carry on without speech rather than breaking the page.
if (!window.NewosVoice) window.NewosVoice = { supported: false, speaking: false, speak() { return Promise.resolve(); }, cancel() {} };
if (!window.NewosListen) window.NewosListen = { supported: false, listening: false, start() { return false; }, stop() {} };
const $ = (id) => document.getElementById(id);
const log = $("log");

/* Where to send messages: this page's own newos server, a newos server on
   this computer (when the page is opened from GitHub Pages), or the small
   browser-only brain below when no server can be reached. */
let API = "api/", local = false;
async function findServer() {
  for (const base of ["api/", "http://localhost:8081/api/"]) {
    try {
      const r = await fetch(base + "state", { cache: "no-store" });
      if (r.ok && (r.headers.get("content-type") || "").includes("json")) { API = base; return true; }
    } catch (e) { /* try the next */ }
  }
  local = true;
  return false;
}
/* ---------------- a small newos brain ---------------- */
const Brain = (() => {
  const blank = () => ({ facts: [], rules: [], replies: {
      "hello": "Hello{name}! What shall we talk about?", "hi": "Hi{name}!", "hey": "Hey{name}!",
      "how are you": "I'm well, thank you. I'm learning all the time. How are you?",
      "thanks": "You're welcome.", "thank you": "You're welcome.", "bye": "Goodbye{name}!", "goodbye": "Goodbye{name}!" },
    words: {}, name: null, display: {} });
  let mem = blank(), pending = null, last = null, lastEntity = null;
  try { const saved = JSON.parse(localStorage.getItem("newos_browser_brain") || "null"); if (saved && saved.facts) mem = Object.assign(blank(), saved); } catch (e) {}
  const save = () => { try { localStorage.setItem("newos_browser_brain", JSON.stringify(mem)); } catch (e) {} };

  const FUNC = new Set("a an the is are am not and or if then of to in on at it he she they this that i you my your me".split(" "));
  const IRREG = { men: "man", women: "woman", people: "person", children: "child", mice: "mouse", feet: "foot", teeth: "tooth", geese: "goose", fish: "fish", sheep: "sheep" };
  const IRREG_PL = Object.fromEntries(Object.entries(IRREG).map(([p, s]) => [s, p]));
  const singular = (w) => IRREG[w] || (/ies$/.test(w) && w.length > 4 ? w.slice(0, -3) + "y" : /(ches|shes|xes|sses|zes)$/.test(w) ? w.slice(0, -2) : /(ss|us|is|ous)$/.test(w) ? w : /s$/.test(w) && w.length > 2 ? w.slice(0, -1) : w);
  const plural = (w) => IRREG_PL[w] || (/[^aeiou]y$/.test(w) ? w.slice(0, -1) + "ies" : /(s|x|z|ch|sh)$/.test(w) ? w + "es" : w + "s");
  const art = (w) => (/^[aeiou]/.test(w) ? "an " : "a ") + w;
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const nameOf = (e) => e === "user" ? "you" : e === "bot" ? "I" : (mem.display[e] || (mem.theWords && mem.theWords[e] ? "the " + e : e));
  const be = (e) => e === "user" ? "are" : e === "bot" ? "am" : "is";

  function norm(text) {
    return text.replace(/[’‘]/g, "'").replace(/\b(\w+)n't\b/gi, (m, b) => b.toLowerCase() === "can" ? "can not" : b.toLowerCase() === "won" ? "will not" : b + " not")
      .replace(/\b(what|who|it|that|there|he|she|where|how)'s\b/gi, "$1 is").replace(/\bi'm\b/gi, "i am").replace(/'re\b/gi, " are")
      .replace(/'s\b/gi, "").trim();
  }
  function words(s) { return s.toLowerCase().replace(/[.!?,;:"]+/g, " ").trim().split(/\s+/).filter(Boolean); }
  function rememberNames(raw) {
    raw.split(/\s+/).forEach((w, i) => { const c = w.replace(/[^\w'-]/g, ""); if (/^[A-Z]/.test(c) && !FUNC.has(c.toLowerCase()) && (i > 0 || !["The", "All", "Every", "Is", "What", "Who"].includes(c))) mem.display[c.toLowerCase()] = c; });
  }
  function entity(ws) {
    if (!ws.length) return null;
    if (ws.length === 1 && ["i", "me"].includes(ws[0])) return "user";
    if (ws.length === 1 && ws[0] === "you") return "bot";
    if (ws.length === 1 && ["it", "he", "she", "they", "him", "her"].includes(ws[0])) return lastEntity || ws[0];
    if (ws[0] === "the") { mem.theWords = mem.theWords || {}; mem.theWords[ws.slice(1).join(" ")] = 1; return ws.slice(1).join(" "); }
    if (ws[0] === "my") return "your " + ws.slice(1).join(" ");
    return ws.join(" ");
  }
  const pred = (ws) => { const a = ws[0] === "a" || ws[0] === "an"; const p = (a ? ws.slice(1) : ws).join(" "); if (a) { mem.nouns = mem.nouns || {}; mem.nouns[p] = 1; } return p; };
  const predText = (p) => (mem.nouns && mem.nouns[p] ? art(p) : p);

  // Is entity e p?  -> {v: true|false|null, why}
  function prove(e, p, depth = 6, seen = new Set()) {
    const f = mem.facts.find((x) => x.s === e && x.p === p);
    if (f) return { v: !f.neg, why: (e === "user" ? "you told me you " : "you told me that " + nameOf(e) + " ") + (f.neg ? be(e) + " not " : be(e) + " ") + predText(p) };
    if (depth <= 0) return { v: null };
    for (const r of mem.rules) {
      if (r.p !== p || seen.has(r.c)) continue;
      const sub = prove(e, r.c, depth - 1, new Set([...seen, r.c]));
      if (sub.v === true) return { v: !r.neg, why: sub.why + ", and " + (r.neg ? "no " : "all ") + plural(r.c) + " are " + (mem.nouns && mem.nouns[p] ? plural(p) : p) };
    }
    return { v: null };
  }
  function describe(e) {
    const preds = new Set([...mem.facts.map((f) => f.p), ...mem.rules.map((r) => r.p)]);
    const yes = [...preds].filter((p) => prove(e, p).v === true).map(predText);
    const no = mem.facts.filter((f) => f.s === e && f.neg).map((f) => predText(f.p));
    const parts = [];
    if (yes.length) parts.push(cap(nameOf(e)) + " " + be(e) + " " + list(yes));
    if (no.length) parts.push(cap(nameOf(e)) + " " + be(e) + " not " + list(no));
    if (mem.words[e]) parts.push("\"" + e + "\" means " + mem.words[e]);
    return parts.length ? parts.join(". ") + "." : "I don't know anything about " + nameOf(e) + " yet. Tell me something!";
  }
  const list = (xs) => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
  function prop(ws) {          // "the moon is cheese" | "2+2=4"
    const s = ws.join(" ");
    if (/^[\d\s+\-*/().]+(=|is|equals)[\d\s+\-*/().]+$/.test(s)) { const [a, b] = s.split(/=|is|equals/); return { math: true, a: a.trim(), b: b.trim() }; }
    const i = ws.findIndex((w) => w === "is" || w === "are" || w === "am");
    if (i < 1) return null;
    const neg = ws[i + 1] === "not";
    return { s: entity(ws.slice(0, i)), p: pred(ws.slice(i + (neg ? 2 : 1))), neg };
  }
  const calc = (e) => { if (!/^[\d\s+\-*/().]+$/.test(e)) return NaN; try { return Function('"use strict";return (' + e + ")")(); } catch (x) { return NaN; } };
  const truthOf = (q) => q.math ? (calc(q.a) === calc(q.b)) : (() => { const r = prove(q.s, q.p).v; return q.neg ? r === false : r === true; })();
  const say = (q) => q.math ? q.a + " = " + q.b : nameOf(q.s) + " " + be(q.s) + (q.neg ? " not " : " ") + predText(q.p);
  const content = (q) => q.math ? [q.a, q.b].join(" ").match(/\d+/g) || [] : [...q.s.split(" "), ...q.p.split(" ")].filter((w) => !FUNC.has(w));

  function reply(raw0) {
    const raw = norm(raw0), ws = words(raw), key = ws.join(" ");
    if (!ws.length) return "Say something and I'll do my best.";
    if (pending && pending.type === "teach") {
      const k = pending.key; pending = null;
      if (!["skip", "never mind", "nothing", "cancel"].includes(key)) {
        mem.replies[k] = raw0.replace(/^say\s+/i, "").trim(); save();
        return "Got it. When you say \"" + k + "\", I'll say \"" + mem.replies[k] + "\".";
      }
      return "OK, never mind.";
    }
    rememberNames(raw);
    let m;
    if ((m = key.match(/^(?:my name is|call me|i am called) (\w+)/))) { mem.name = m[1]; save(); return "Nice to meet you, " + nameOf(m[1]) + "."; }
    if (/^(what is my name|who am i)$/.test(key)) return mem.name ? "Your name is " + nameOf(mem.name) + "." : "You haven't told me your name yet.";
    if (/^(who are you|what are you|what is your name)$/.test(key)) return "I'm newos, running in your browser. I learn whatever you teach me.";
    if ((m = raw.match(/^(?:when|if) i say (.+?),? (?:you )?(?:should )?(?:say|reply|answer) (.+)$/i))) {
      const k = words(m[1]).join(" "); mem.replies[k] = m[2].replace(/^["']|["']$/g, ""); save();
      return "Got it. When you say \"" + k + "\", I'll say \"" + mem.replies[k] + "\".";
    }
    if ((m = key.match(/^(\w+) means (.+)$/)) || (m = key.match(/^define (\w+) as (.+)$/))) { mem.words[m[1]] = m[2]; save(); return "Thanks. Now I know that " + m[1] + " means " + m[2] + "."; }
    if ((m = key.match(/^what does (\w+) mean$/))) return mem.words[m[1]] ? "\"" + m[1] + "\" means " + mem.words[m[1]] + "." : "I don't know what " + m[1] + " means yet. Tell me: " + m[1] + " means...";
    if ((m = raw.toLowerCase().match(/^(?:what is|what's|calculate)\s+([\d\s+\-*/().]+)\??$/))) { const v = calc(m[1]); return isNaN(v) ? "I can't work that out." : m[1].trim() + " is " + v + "."; }
    if (key === "why") return last ? "Because " + last + "." : "Ask me something first, then ask why.";
    if (key === "forget everything") { mem = blank(); save(); return "I've forgotten everything and started fresh."; }
    if ((m = raw.match(/^(compare )?if (.+?),? then (.+?)\??$/i))) {
      const a = prop(words(m[2])), b = prop(words(m[3]));
      if (a && b) {
        const ta = truthOf(a), tb = truthOf(b), shared = content(a).filter((w) => content(b).includes(w));
        const mat = !ta || tb;
        let r = "As a material conditional, \"if " + say(a) + " then " + say(b) + "\" is " + mat + ".";
        if (mat && !ta) r += " But only because \"" + say(a) + "\" is false, a paradox of material implication.";
        r += shared.length ? " In relevance logic the two share content (" + shared.join(", ") + ")." : " In relevance logic it fails: the two parts share no content.";
        return r;
      }
    }
    const generic = key.match(/^(\w+) are (not )?(.+)$/);
    if (generic && singular(generic[1]) !== generic[1] && !FUNC.has(generic[1]) && !mem.facts.some((f) => f.s === generic[1])) m = generic;
    else m = null;
    if (m || (m = key.match(/^(?:all|every|each) (\w+) (?:is|are) (not )?(.+)$/)) || (m = key.match(/^no (\w+) (?:is|are) ()(.+)$/))) {
      const c = singular(m[1]); let p = pred(m[3].split(" "));
      if (!mem.nouns || !mem.nouns[p]) { const sp = singular(p); if (sp !== p && !p.includes(" ")) { p = sp; mem.nouns = mem.nouns || {}; mem.nouns[p] = 1; } }
      mem.rules.push({ c, p, neg: !!m[2] || key.startsWith("no ") }); save();
      const so = [...new Set(mem.facts.map((f) => f.s))].filter((e) => prove(e, c).v === true);
      return "Got it: " + (key.startsWith("no ") || m[2] ? "no " : "all ") + plural(c) + " are " + (mem.nouns[p] ? plural(p) : p) + "." +
        (so.length && !m[2] ? " So " + list(so.map((e) => nameOf(e) + " " + be(e) + " " + predText(p))) + ", too." : "");
    }
    if ((m = key.match(/^(?:is|are|am) (.+)$/))) {
      const w2 = m[1].split(" ");
      const n = w2[0] === "the" || w2[0] === "my" ? 2 : 1;
      const e = entity(w2.slice(0, n)), neg = w2[n] === "not", p = pred(w2.slice(n + (neg ? 1 : 0)));
      if (e && p) {
        lastEntity = e === "user" || e === "bot" ? lastEntity : e;
        const r = prove(e, p);
        last = r.why || null;
        if (r.v === null) return "I don't know whether " + nameOf(e) + " " + be(e) + " " + predText(p) + ". Tell me and I'll remember.";
        const yes = neg ? !r.v : r.v;
        return (yes ? "Yes. " : "No. ") + cap(nameOf(e)) + " " + be(e) + (r.v ? " " : " not ") + predText(p) + ".";
      }
    }
    if ((m = key.match(/^(?:who|what) (?:is|are) (.+)$/)) || (m = key.match(/^(?:what do you know about|tell me about) (.+)$/))) {
      const w2 = m[1].split(" "), e = entity(w2);
      const known = mem.facts.some((f) => f.s === e) || e === "user" || e === "bot";
      if (known) { lastEntity = e; return describe(e); }
      const p = pred(w2);
      const who = [...new Set(mem.facts.map((f) => f.s))].filter((x) => prove(x, p).v === true);
      if (who.length) return cap(list(who.map(nameOf))) + (who.length > 1 ? " are " : " " + be(who[0]) + " ") + predText(p) + ".";
      if (mem.words[e]) return "\"" + e + "\" means " + mem.words[e] + ".";
    }
    if (mem.replies[key]) return mem.replies[key].replace("{name}", mem.name ? ", " + nameOf(mem.name) : "");
    if (/ (is|are|am) /.test(" " + key + " ") && !/^(what|who|why|how|where|when)\b/.test(key)) {
      const q = prop(ws);
      if (q && q.math) return calc(q.a) === calc(q.b) ? "That's right." : "Actually, " + q.a + " is " + calc(q.a) + ".";
      if (q && q.s && q.p) {
        const before = prove(q.s, q.p).v;
        mem.facts = mem.facts.filter((f) => !(f.s === q.s && f.p === q.p));
        mem.facts.push({ s: q.s, p: q.p, neg: q.neg }); save();
        if (q.s !== "user" && q.s !== "bot") lastEntity = q.s;
        const follows = mem.rules.filter((r) => r.c === q.p && !q.neg).map((r) => nameOf(q.s) + " " + be(q.s) + (r.neg ? " not " : " ") + predText(r.p));
        return (before !== null && before === q.neg ? "Oh, I thought otherwise. I've updated that: " : "I'll remember that: ") + say(q) + "." + (follows.length ? " That means " + list(follows) + "." : "");
      }
    }
    // closest learned reply
    const kw = new Set(ws);
    let best = null, score = 0;
    for (const [k, v] of Object.entries(mem.replies)) {
      const kk = new Set(k.split(" ")), inter = [...kk].filter((x) => kw.has(x)).length;
      const s = inter / new Set([...kk, ...kw]).size;
      if (s > score) { score = s; best = v; }
    }
    if (best && score >= 0.5) return best.replace("{name}", mem.name ? ", " + nameOf(mem.name) : "");
    pending = { type: "teach", key };
    return "I'm not sure how to answer that yet. What should I say when you say that?";
  }
  return { reply };
})();


let voiceOn = false, state = null, tab = "logic";
try { voiceOn = localStorage.getItem("newos_voice") === "1"; } catch (e) {}

const EXAMPLES = [
  "Socrates is a man.", "All men are mortal.", "Is Socrates mortal?", "Why?",
  "If the moon is cheese, then 2+2=4.", "Compare if the moon is cheese then 2+2=4",
  "In world w1, the moon is cheese.", "Use lewis semantics",
  "Flurb means a small blue bird.", "When I say good night, you say sleep well!",
  "dear diary I enjoyed writing today", "open welcome", "help",
];

function add(who, text) {
  const row = document.createElement("div");
  row.className = "msg " + who;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  if (who === "bot" && NewosVoice.supported) {
    const s = document.createElement("button");
    s.className = "speak"; s.title = "Read aloud"; s.textContent = "🔈";
    s.onclick = () => NewosVoice.speak(text);
    row.appendChild(s);
  }
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  add("me", text);
  $("text").value = "";
  $("chips").style.display = "none";
  if (local) {
    const reply = Brain.reply(text);
    add("bot", reply);
    if (voiceOn) NewosVoice.speak(reply);
    return;
  }
  let j;
  try {
    const r = await fetch(API + "chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    j = await r.json();
  } catch (e) {
    $("offline").style.display = "block";
    add("bot", "I can't reach my server right now.");
    return;
  }
  $("offline").style.display = "none";
  add("bot", j.reply || "(no reply)");
  if (j.semantics) $("sem").value = j.semantics;
  if (voiceOn) NewosVoice.speak(j.speak);
  refresh();
}

$("bar").addEventListener("submit", (e) => { e.preventDefault(); send($("text").value); });

EXAMPLES.forEach((t) => {
  const c = document.createElement("button");
  c.className = "chip"; c.type = "button"; c.textContent = t;
  c.onclick = () => send(t);
  $("chips").appendChild(c);
});

$("sem").addEventListener("change", async () => {
  await fetch(API + "semantics", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("sem").value }) });
  send("which semantics");
});

function paintVoice() { $("voiceBtn").classList.toggle("on", voiceOn); $("voiceBtn").textContent = voiceOn ? "🔊 Voice" : "🔈 Voice"; }
$("voiceBtn").onclick = () => {
  voiceOn = !voiceOn; paintVoice();
  try { localStorage.setItem("newos_voice", voiceOn ? "1" : "0"); } catch (e) {}
  if (!voiceOn) NewosVoice.cancel();
};
if (!NewosVoice.supported) $("voiceBtn").style.display = "none";
paintVoice();

// voice input
let micOn = false;
if (!NewosListen.supported) { $("micBtn").title = "Voice input needs Chrome, Edge or Safari"; $("micBtn").style.opacity = .35; }
$("micBtn").onclick = () => {
  if (!NewosListen.supported) { add("bot", "Voice input needs Chrome, Edge or Safari. You can still type."); return; }
  micOn = !micOn;
  $("micBtn").classList.toggle("live", micOn);
  if (micOn) {
    if (!voiceOn) { voiceOn = true; paintVoice(); }
    NewosListen.start({
      onFinal: (t) => { $("interim").textContent = ""; send(t); },
      onInterim: (t) => { $("interim").textContent = t; },
      onState: (s) => { if (s === "denied") { micOn = false; $("micBtn").classList.remove("live"); add("bot", "I wasn't allowed to use the microphone."); } },
    });
  } else { NewosListen.stop(); $("interim").textContent = ""; }
};

// knowledge panel
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const list = (xs, f = esc) => xs && xs.length ? "<ul>" + xs.map((x) => "<li>" + f(x) + "</li>").join("") + "</ul>" : '<div class="empty">Nothing yet.</div>';
function paint() {
  if (!state) return;
  const p = $("panel");
  if (tab === "logic") p.innerHTML = `<h3>Facts</h3>${list(state.facts)}<h3>Rules</h3>${list(state.rules)}<h3>“If” laws</h3>${list(state.laws)}`;
  if (tab === "worlds") p.innerHTML = `<h3>Possible worlds</h3>` + (state.worlds.length ? state.worlds.map((w) =>
      `<div><b>${esc(w.name)}</b> <span class="src">distance ${w.distance} · weight ${w.weight}</span>${list(w.facts)}</div>`).join("")
      : '<div class="empty">Only the actual world. Try: <i>In world w1, the moon is cheese.</i></div>');
  if (tab === "words") p.innerHTML = `<h3>Words I've learned</h3>` + list(state.words, (w) =>
      `<span class="w">${esc(w.word)}</span><span class="src">${esc(w.source)}</span><br>${w.meaning ? esc(w.meaning) : '<i class="empty">meaning not known yet</i>'}`);
  if (tab === "replies") p.innerHTML = `<h3>When you say… I say…</h3>` + list(state.replies, (r) => `<b>${esc(r.when)}</b> → ${esc(r.say)}`);
  if (tab === "files") p.innerHTML = `<h3>Files (you are in ${esc(state.cwd)})</h3>` + list(state.files, (f) => `<a href="#" data-open="${esc(f.name)}">${esc(f.folder)}/${esc(f.name)}</a>`);
  p.querySelectorAll("[data-open]").forEach((a) => a.onclick = (e) => { e.preventDefault(); send("open " + a.dataset.open); });
}
async function refresh() {
  try { state = await (await fetch(API + "state", { cache: "no-store" })).json(); $("sem").value = state.semantics; paint(); } catch (e) { /* offline */ }
}
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
  tab = t.dataset.tab; paint();
});
$("panelBtn").onclick = () => $("side").classList.toggle("open");
$("saveBtn").onclick = async () => { await fetch(API + "save", { method: "POST" }); add("bot", "Saved."); };
$("importIn").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = await fetch(API + "import", { method: "POST", headers: { "Content-Type": "text/plain" }, body: await f.text() });
  const j = await r.json(); add("bot", `Imported ${j.loaded} items.`); refresh();
};
$("resetBtn").onclick = () => send("reset everything");

(async function boot() {
  await findServer();
  if (local) {
    $("sem").disabled = true; $("sem").title = "The browser-only brain reads if as material and relevance logic";
    document.querySelector(".foot").style.display = "none";
    $("panel").innerHTML = '<div class="empty">Running in your browser without the Prolog server, with a smaller brain. Its memory is kept in this browser. For everything newos can do, run <b>swipl newos.pl</b> and open http://localhost:8081.</div>';
    add("bot", "Hi, I'm newos, running in your browser. Teach me facts, rules, words and replies, and ask me questions. For the full newos, run it with SWI-Prolog.");
  } else {
    $("exportBtn").href = API + "export";
    add("bot", "Hi, I'm newos. Teach me facts, words and rules, ask me questions, or test how I read “if… then”. Type, or press 🎙 to talk.");
    refresh();
  }
})();
</script>
</body>
